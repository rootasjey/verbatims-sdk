name: Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'nuxt/**'
      - 'packages/cli/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.releaserc'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Publish CLI
        run: |
          CURRENT=$(node -p "require('./packages/cli/package.json').version")
          LATEST=$(npm view @verbatims/cli version 2>/dev/null || echo "0.0.0")
          if [ "$CURRENT" = "$LATEST" ]; then
            npm version patch -w packages/cli --no-git-tag-version
          fi
          npm publish -w packages/cli --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
