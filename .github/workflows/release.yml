name: Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'packages/cli/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Publish SDK
        run: |
          LATEST=$(npm view @verbatims/sdk version 2>/dev/null || echo "0.0.0")
          node -e "const p=JSON.parse(require('fs').readFileSync('./package.json','utf8')); const v='$LATEST'.split('.'); v[2]=+v[2]+1; p.version=v.join('.'); require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2)+'\n')"
          npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump SDK version to $(node -p "require('./package.json').version") [skip ci]"
          git push

  release-cli:
    needs: release-sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Publish CLI
        run: |
          LATEST=$(npm view @verbatims/cli version 2>/dev/null || echo "0.0.0")
          node -e "const p=JSON.parse(require('fs').readFileSync('./packages/cli/package.json','utf8')); const v='$LATEST'.split('.'); v[2]=+v[2]+1; p.version=v.join('.'); require('fs').writeFileSync('./packages/cli/package.json', JSON.stringify(p, null, 2)+'\n')"
          npm publish -w packages/cli --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/cli/package.json
          git commit -m "chore: bump CLI version to $(node -p "require('./packages/cli/package.json').version") [skip ci]"
          git pull --rebase
          git push
