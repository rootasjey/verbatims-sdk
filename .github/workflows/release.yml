name: Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'packages/cli/**'
      - 'package.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Publish SDK
        run: |
           LATEST=$(npm view @verbatims/sdk version 2>/dev/null || echo "0.0.0")
           CURRENT=$(node -p "require('./package.json').version")
           if git log -1 --pretty=%B | grep -q '\[major\]'; then TARGET=$CURRENT; else TARGET=$(node -e "const v='$LATEST'.split('.').map(Number); v[2]++; console.log(v.join('.'))"); fi
           node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('./package.json','utf8')); p.version='$TARGET'; fs.writeFileSync('./package.json', JSON.stringify(p, null, 2)+'\n')"
           if npm view "@verbatims/sdk@$TARGET" version >/dev/null 2>&1; then echo "@verbatims/sdk@$TARGET already published"; else npm publish --ignore-scripts; fi
      - name: Create SDK GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="sdk-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists"
          else
            cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Published as [@verbatims/sdk@$VERSION](https://www.npmjs.com/package/@verbatims/sdk/v/$VERSION).

          Source commit: $GITHUB_SHA.
          EOF
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Verbatims SDK v$VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
           git add package.json
           if git diff --cached --quiet; then echo "No SDK version bump to commit"; else git commit -m "chore: bump SDK version to $(node -p "require('./package.json').version") [skip ci]"; git push; fi

  release-cli:
    needs: release-sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
      - name: Pin published SDK for CLI build
        run: |
          SDK_LATEST=$(npm view @verbatims/sdk version)
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('./packages/cli/package.json','utf8')); p.dependencies['@verbatims/sdk']='^$SDK_LATEST'; fs.writeFileSync('./packages/cli/package.json', JSON.stringify(p, null, 2)+'\n')"
      - run: bun install
      - name: Publish CLI
        run: |
          LATEST=$(npm view @verbatims/cli version 2>/dev/null || echo "0.0.0")
          SDK_LATEST=$(npm view @verbatims/sdk version)
          CURRENT=$(node -p "require('./packages/cli/package.json').version")
          if git log -1 --pretty=%B | grep -q '\[major\]'; then TARGET=$CURRENT; else TARGET=$(node -e "const v='$LATEST'.split('.').map(Number); v[2]++; console.log(v.join('.'))"); fi
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('./packages/cli/package.json','utf8')); p.version='$TARGET'; p.dependencies['@verbatims/sdk']='^$SDK_LATEST'; fs.writeFileSync('./packages/cli/package.json', JSON.stringify(p, null, 2)+'\n')"
          if npm view "@verbatims/cli@$TARGET" version >/dev/null 2>&1; then echo "@verbatims/cli@$TARGET already published"; else npm publish -w packages/cli --ignore-scripts; fi
      - name: Create CLI GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          TAG="cli-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists"
          else
            cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Published as [@verbatims/cli@$VERSION](https://www.npmjs.com/package/@verbatims/cli/v/$VERSION).

          Source commit: $GITHUB_SHA.
          EOF
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Verbatims CLI v$VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
           git add packages/cli/package.json bun.lock
           if git diff --cached --quiet; then echo "No CLI version bump to commit"; else git commit -m "chore: bump CLI version to $(node -p "require('./packages/cli/package.json').version") [skip ci]"; git pull --rebase; git push; fi
